name: Catalog and cart browser smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'tests/site.spec.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile storefront
        id: qa
        run: npx playwright test tests/site.spec.js --workers=1 --reporter=line
      - name: Commit QA result for review
        if: always()
        env:
          QA_RESULT: ${{ steps.qa.outcome }}
        run: |
          mkdir -p reports
          python3 -c 'import json,os;json.dump({"result":os.environ["QA_RESULT"],"run_id":os.environ["GITHUB_RUN_ID"],"commit":os.environ["GITHUB_SHA"]},open("reports/latest-qa.json","w"),indent=2)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest-qa.json
          git commit -m "Record storefront browser test result" || true
          git push || true
      - name: Upload screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvir-browser-review
          path: |
            test-results/
            playwright-report/
          retention-days: 7
