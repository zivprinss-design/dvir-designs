name: Repair imported product screenshots
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_product_photos.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Get website files
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Crop screenshot chrome from original product photographs
        run: python scripts/repair_product_photos.py
      - name: Publish clean original files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pillows/p174.webp assets/pillows/p175.webp assets/curtains/c026.webp assets/curtains/c048.webp
          if git diff --cached --quiet; then
            echo "Photos are already clean"
          else
            git commit -m "Crop phone screenshot bars from four original product photos"
            git push
          fi
